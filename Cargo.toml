[workspace]
members = ["crates/meow-agent", "crates/meow-cli", "crates/meow-core", "crates/meow-index", "crates/meow-llm", "crates/meow-policy", "crates/meow-session", "crates/meow-star", "crates/meow-store", "crates/meow-ui"]
resolver = "3"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/retran/meowg1k"


# Every crate inherits these with `lints.workspace = true`.
[workspace.lints.rust]
# Deny rather than forbid: a crate that genuinely needs `unsafe` can override
# this with an `#![allow]` and a comment saying why, and that override is
# visible in review. `forbid` cannot be overridden at all, which turns a rare
# justified case into a fight with the lint.
unsafe_code = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The terminal renderer owns the cursor. A stray `println!` writes straight
# through the live frame and corrupts it, which is how the Go implementation
# lost its display to ten `log.Printf` calls in the agent loop. Only
# `meow-cli` may print, and it overrides these two.
print_stdout = "deny"
print_stderr = "deny"

# `unwrap` and `expect` in a library both turn a recoverable error into a
# process death; the message `expect` carries explains the invariant to whoever
# reads the crash, not to whoever avoided it. Tests are exempt through
# `clippy.toml`. Both are denied rather than one warned, because CI runs with
# `-D warnings` and a warn-level lint is an error there anyway - saying "warn"
# would describe a leniency that does not exist.
unwrap_used = "deny"
expect_used = "deny"

dbg_macro = "deny"
todo = "deny"

# `release` sits inside the development loop, so it stays fast to build. Thin
# LTO is most of the win for a fraction of the link time.
[profile.release]
lto = "thin"

# `dist` is what ships. Fat LTO with one codegen unit lets the agent loop
# inline across crate boundaries, at a link cost that is fine to pay once in
# CI. Any published measurement should name the profile it came from.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
