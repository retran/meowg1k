version: "3"

vars:
  PROJECT_NAME: meowg1k
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo "v0.1.0"
  GIT_COMMIT:
    sh: git rev-parse --short HEAD 2>/dev/null || echo "unknown"
  BUILD_DATE:
    sh: date -u '+%Y-%m-%d_%H:%M:%S'
  LDFLAGS: >-
    -s -w
    -X github.com/retran/meowg1k/internal/version.Version={{.VERSION}}
    -X github.com/retran/meowg1k/internal/version.BuildDate={{.BUILD_DATE}}
    -X github.com/retran/meowg1k/internal/version.GitCommit={{.GIT_COMMIT}}
  GOFLAGS: -trimpath -buildvcs=false
  COVERAGE_THRESHOLD: 65.0
  # Colors
  GREEN: \033[0;32m
  BLUE: \033[0;34m
  NC: \033[0m

tasks:
  deps:install:
    desc: Download and tidy Go modules
    cmds:
      - go mod download
      - go mod tidy

  check:all:
    desc: Run all checks (lint, test, security) in parallel
    deps:
      - check:lint
      - check:test
      - check:security

  check:lint:
    desc: Run golangci-lint
    cmds:
      - golangci-lint run --timeout=5m

  check:test:
    desc: Run tests with coverage
    cmds:
      - go test -v -race -coverprofile=coverage.out -covermode=atomic ./...
      - task: internal:coverage-check

  check:security:
    desc: Run security checks (gosec, govulncheck)
    cmds:
      - gosec ./...
      - govulncheck ./...

  fix:fmt:
    desc: Format code (goimports via golangci-lint fmt)
    cmds:
      - golangci-lint fmt

  fix:lint:
    desc: Auto-fix lint issues
    cmds:
      - golangci-lint run --fix --timeout=5m

  build:
    desc: Build the binary
    sources:
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - bin/meow
    cmds:
      - mkdir -p bin
      - CGO_ENABLED=0 GOFLAGS="{{.GOFLAGS}}" go build -ldflags "{{.LDFLAGS}}" -o "bin/meow" ./cmd/meow

  install:
    desc: Install binary to GOBIN
    cmds:
      - |
        BIN_DIR="$(go env GOBIN)"; [ -z "$BIN_DIR" ] && BIN_DIR="$(go env GOPATH)/bin"
        CGO_ENABLED=0 GOFLAGS="{{.GOFLAGS}}" go build -ldflags "{{.LDFLAGS}}" -o "$BIN_DIR/meow" ./cmd/meow

  release:
    desc: Release via GoReleaser
    cmds:
      - goreleaser release --clean

  release:snapshot:
    desc: Build snapshot release
    cmds:
      - goreleaser release --snapshot --clean

  clean:
    desc: Clean artifacts
    cmds:
      - rm -rf bin coverage.out coverage.html dist profiles bench

  # ============================================================
  # Development Tasks
  # ============================================================

  dev:setup:
    desc: Install all development dependencies and git hooks
    cmds:
      - task: deps:install
      - task: tools:install
      - task: hooks:install

  dev:run:
    desc: Build (if needed) and run meow
    deps: [build]
    cmds:
      - ./bin/meow --help

  dev:watch:
    desc: Auto-rebuild on file changes (requires entr)
    cmds:
      - find . -name '*.go' -not -path './vendor/*' | entr -c task build

  dev:debug:
    desc: Build with debug flags and run with dlv debugger
    cmds:
      - go build -gcflags="all=-N -l" -o bin/meow-debug ./cmd/meow
      - dlv exec ./bin/meow-debug

  dev:profile:
    desc: Run with CPU and memory profiling enabled
    deps: [build]
    cmds:
      - mkdir -p profiles
      - ./bin/meow --cpuprofile=profiles/cpu.prof --memprofile=profiles/mem.prof

  # ============================================================
  # Testing Tasks
  # ============================================================

  test:unit:
    desc: Run unit tests only (short mode)
    cmds:
      - go test -v -short ./...

  test:integration:
    desc: Run integration tests
    cmds:
      - go test -v -run Integration ./...

  test:watch:
    desc: Run tests in watch mode (requires entr)
    cmds:
      - find . -name '*.go' -not -path './vendor/*' | entr -c go test ./...

  test:race:
    desc: Run tests with race detector
    cmds:
      - go test -race ./...

  test:msan:
    desc: Run tests with memory sanitizer (Linux only, requires clang)
    cmds:
      - CC=clang go test -msan ./...

  test:verbose:
    desc: Run tests with verbose output, disabling cache
    cmds:
      - go test -v -count=1 ./...

  # ============================================================
  # Coverage Tasks
  # ============================================================

  coverage:html:
    desc: Generate HTML coverage report
    deps: [check:test]
    cmds:
      - go tool cover -html=coverage.out -o coverage.html

  coverage:func:
    desc: Show function-level coverage
    deps: [check:test]
    cmds:
      - go tool cover -func=coverage.out

  coverage:badge:
    desc: Print coverage percentage and suggested badge color
    deps: [check:test]
    cmds:
      - |
        COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/{print $3}' | tr -d '%')
        COLOR=$(awk -v c="$COVERAGE" 'BEGIN{ if (c+0 > 80) print "green"; else if (c+0 > 60) print "yellow"; else print "red" }')
        printf "Coverage: ${COVERAGE}%% (Color: $COLOR)\n"

  # ============================================================
  # Linting Tasks
  # ============================================================

  lint:fast:
    desc: Quick lint with essential linters only
    cmds:
      - golangci-lint fmt --diff
      - golangci-lint run --enable-only=govet,errcheck,staticcheck --timeout=2m

  lint:new:
    desc: Lint only new/changed code (since HEAD~1)
    cmds:
      - golangci-lint run --new-from-rev=HEAD~1 --timeout=5m

  # ============================================================
  # Benchmarking Tasks
  # ============================================================

  bench:
    desc: Run benchmarks and save results
    cmds:
      - mkdir -p bench
      - go test -bench=. -benchmem -run=^$ ./... | tee bench/current.txt

  bench:baseline:
    desc: Save current benchmark results as baseline
    deps: [bench]
    cmds:
      - cp bench/current.txt bench/baseline.txt

  bench:compare:
    desc: Compare benchmarks against baseline
    cmds:
      - |
        if [ ! -f bench/baseline.txt ]; then
          echo "No baseline found. Run 'task bench:baseline' first."
          exit 1
        fi
      - go test -bench=. -benchmem -run=^$ ./... | tee bench/current.txt
      - go run golang.org/x/perf/cmd/benchstat@latest bench/baseline.txt bench/current.txt

  bench:profile:
    desc: Run benchmarks with CPU and memory profiling
    cmds:
      - mkdir -p profiles
      - go test -bench=. -benchmem -cpuprofile=profiles/bench-cpu.prof -memprofile=profiles/bench-mem.prof -run=^$ ./...

  # ============================================================
  # Profiling Tasks
  # ============================================================

  profile:cpu:
    desc: Generate CPU profile and open with pprof
    cmds:
      - mkdir -p profiles
      - go test -cpuprofile=profiles/cpu.prof -bench=. ./...
      - go tool pprof -http=:8080 profiles/cpu.prof

  profile:mem:
    desc: Generate memory profile and open with pprof
    cmds:
      - mkdir -p profiles
      - go test -memprofile=profiles/mem.prof -bench=. ./...
      - go tool pprof -http=:8080 profiles/mem.prof

  profile:trace:
    desc: Generate and view execution trace
    cmds:
      - mkdir -p profiles
      - go test -trace=profiles/trace.out ./...
      - go tool trace profiles/trace.out

  # ============================================================
  # CI Tasks
  # ============================================================

  ci:local:
    desc: Run full CI pipeline locally (deps → checks → build)
    cmds:
      - task: deps:install
      - task: check:all
      - task: build

  ci:pre-commit:
    desc: Run pre-commit checks (fmt, fast lint, unit tests)
    cmds:
      - task: fix:fmt
      - task: lint:fast
      - task: test:unit

  ci:pre-push:
    desc: Run pre-push checks (lint, test, build)
    cmds:
      - task: check:lint
      - task: check:test
      - task: build

  # ============================================================
  # Tools Tasks
  # ============================================================

  tools:install:
    desc: Install development tools
    cmds:
      - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
      - go install github.com/securego/gosec/v2/cmd/gosec@latest
      - go install golang.org/x/vuln/cmd/govulncheck@latest
      - go install golang.org/x/perf/cmd/benchstat@latest
      - go install github.com/go-delve/delve/cmd/dlv@latest

  hooks:install:
    desc: Install git hooks via pre-commit
    cmds:
      - |
        if command -v pre-commit >/dev/null 2>&1; then
          pre-commit install
        else
          printf "pre-commit not found. Install with: pip install pre-commit\n"
        fi

  # ============================================================
  # Release Tasks
  # ============================================================

  release:prepare:
    desc: Prepare release (clean, install, full CI, build)
    cmds:
      - task: clean
      - task: deps:install
      - task: ci:local

  release:tag:
    desc: Create and push a release tag (prompts for version)
    cmds:
      - |
        printf "Current version: {{.VERSION}}\n"
        printf "Enter new version (e.g. v2.0.0): "
        read -r VERSION
        git tag -a "$VERSION" -m "Release $VERSION"
        git push origin "$VERSION"
        printf "Tag $VERSION created and pushed.\n"

  # ============================================================
  # Internal Tasks
  # ============================================================

  internal:coverage-check:
    internal: true
    silent: true
    cmds:
      - |
        COVERAGE=$(go tool cover -func=coverage.out | awk '/^total:/{print $3}' | tr -d '%')
        echo "Coverage: ${COVERAGE}% (Threshold: {{.COVERAGE_THRESHOLD}}%)"
        awk -v c="$COVERAGE" -v t="{{.COVERAGE_THRESHOLD}}" 'BEGIN{
          if (c+0 < t+0) { print "FAIL: Coverage below threshold"; exit 1 }
        }'
