# Markdown and YAML linting, in its own workflow because it cannot live in one
# that filters by source path. A documentation change matches no Go or Rust
# path, so the job would never run on the change it exists to check - which is
# what happened for months, and why 411 findings had accumulated unseen (#104).
name: Docs

on:
  push:
    branches: [dev]
    paths:
      - "**/*.md"
      - "**/*.yaml"
      - "**/*.yml"
      - ".markdownlint.yaml"
      - ".yamllint.yaml"
      - ".github/workflows/docs.yaml"
  pull_request:
    branches: [dev]
    paths:
      - "**/*.md"
      - "**/*.yaml"
      - "**/*.yml"
      - ".markdownlint.yaml"
      - ".yamllint.yaml"
      - ".github/workflows/docs.yaml"

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Markdown & YAML Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      # The globs match `mise run lint-md`, so the local gate and CI check the
      # same files. Prompt files under .claude/ are excluded: their XML tags
      # are written for a model, not a reader, and MD033 is right about every
      # other document.
      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@ce4853d43830c74c1753b39f3cf40f71c2031eb9 # v23
        with:
          config: '.markdownlint.yaml'
          globs: |
            **/*.md
            #target
            #node_modules
            #.claude
            #CLAUDE.md

      - name: YAML Lint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # v3.1.1
        with:
          config_file: .yamllint.yaml
          file_or_dir: .
          strict: false
