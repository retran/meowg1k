name: CI

on:
  push:
    branches: [dev, main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".golangci.yaml"
      - "Taskfile.yaml"
      - ".goreleaser.yaml"
      - ".github/workflows/ci.yaml"
  pull_request:
    branches: [dev, main]
    paths:
      - "cmd/**"
      - "internal/**"
      - "go.mod"
      - "go.sum"
      - ".golangci.yaml"
      - "Taskfile.yaml"
      - ".goreleaser.yaml"
      - ".github/workflows/ci.yaml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write
  security-events: write

jobs:
  # ============================================================
  # Stage 1: Fast Lint (~1 min)
  # ============================================================
  fast-lint:
    name: Fast Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint (fast)
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.12.2
          args: --enable-only=govet,errcheck,staticcheck --timeout=2m

  # ============================================================
  # Stage 2: Full Lint (parallel, ~3 min)
  # ============================================================
  full-lint:
    name: Full Lint
    runs-on: ubuntu-latest
    needs: fast-lint
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint (full)
        uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.12.2
          args: --timeout=5m

  # ============================================================
  # Stage 3: Security Scan (parallel, ~2 min)
  # ============================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: fast-lint
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Run gosec
        uses: securego/gosec@424fc4cd9c82ea0fd6bee9cd49c2db2c3cc0c93f # v2.22.11
        with:
          args: "-no-fail -fmt sarif -out gosec.sarif ./..."

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@5d4e8d1aca955e8d8589aabd499c5cae939e33c7 # v4
        with:
          sarif_file: gosec.sarif
          category: gosec

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # Stage 4: Unit Tests (matrix, ~5 min)
  # ============================================================
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [full-lint, security]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        uses: arduino/setup-task@24c5e13bce349197642746563945fcdf9355e8f4 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Tests
        run: task check:test

      - name: Upload Coverage
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6
        with:
          files: coverage.out
          fail_ci_if_error: false

  # ============================================================
  # Stage 5: Integration Tests (~3 min)
  # ============================================================
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [full-lint, security]
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        uses: arduino/setup-task@24c5e13bce349197642746563945fcdf9355e8f4 # v2.0.0
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Integration Tests
        run: task test:integration

  # ============================================================
  # Stage 6: Build Matrix (~4 min)
  # ============================================================
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    needs: [test, integration-test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup Go
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "v0.1.0")
          GIT_COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          BUILD_DATE=$(date -u '+%Y-%m-%d_%H:%M:%S')
          LDFLAGS="-s -w \
            -X github.com/retran/meowg1k/internal/version.Version=${VERSION} \
            -X github.com/retran/meowg1k/internal/version.BuildDate=${BUILD_DATE} \
            -X github.com/retran/meowg1k/internal/version.GitCommit=${GIT_COMMIT}"
          go build -trimpath -ldflags "${LDFLAGS}" \
            -o bin/meow${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/meow

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: meow-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/meow${{ matrix.goos == 'windows' && '.exe' || '' }}
          retention-days: 7

  # ============================================================
  # Stage 7: All Checks Passed
  # ============================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [full-lint, security, test, integration-test, build]
    if: always()
    steps:
      - name: Check all jobs succeeded
        env:
          FULL_LINT: ${{ needs.full-lint.result }}
          SECURITY: ${{ needs.security.result }}
          TEST: ${{ needs.test.result }}
          INTEGRATION: ${{ needs.integration-test.result }}
          BUILD: ${{ needs.build.result }}
        run: |
          failed=()
          [ "$FULL_LINT"     != "success" ] && failed+=("full-lint")
          [ "$SECURITY"      != "success" ] && failed+=("security")
          [ "$TEST"          != "success" ] && failed+=("test")
          [ "$INTEGRATION"   != "success" ] && failed+=("integration-test")
          [ "$BUILD"         != "success" ] && failed+=("build")
          if [ ${#failed[@]} -gt 0 ]; then
            echo "Failed jobs: ${failed[*]}"
            exit 1
          fi
          echo "All CI checks passed."
