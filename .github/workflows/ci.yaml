# CI for the whole tree. There was a path filter here while the Go
# implementation still existed and the two trees paid for each other's runs;
# there is one tree now, so every change runs everything.
name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Formatting is seconds and needs no cache, so it gates the rest.
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: fmt
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install nextest
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2
        with:
          tool: cargo-nextest

      - name: Run tests
        run: cargo nextest run --locked --workspace --no-tests=pass

  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build documentation
        run: cargo doc --locked --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

  deny:
    name: Advisories and licences
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check

  unused-deps:
    name: Unused dependencies
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install cargo-machete
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2
        with:
          tool: cargo-machete

      - name: Find unused dependencies
        run: cargo machete

  # `CLAUDE.md` says `mise run all` runs the same checks CI does, so a green
  # run locally means a green run here. Nothing held that true: the two lists
  # are maintained in different files, and a task added to one would silently
  # not run in the other. This is the cheapest thing that makes the claim
  # checkable - it compares the two lists and fails naming the difference.
  gates-agree:
    name: Local gate matches CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6

      - name: Compare the two lists
        shell: bash
        run: |
          set -euo pipefail

          # What `mise run all` depends on, in sorted order.
          local_gates=$(
            grep -A1 '^\[tasks\.all\]' mise.toml \
              | grep '^depends' \
              | grep -oE '"[a-z-]+"' \
              | tr -d '"' | sort | tr '\n' ' '
          )

          # What CI runs, stated here because a workflow cannot ask itself.
          # `lint-md` lives in docs.yaml; the rest are jobs in this file.
          ci_gates=$(printf '%s\n' \
            fmt-check check test doc deny unused-deps lint-md | sort | tr '\n' ' ')

          if [ "$local_gates" != "$ci_gates" ]; then
            echo "::error::`mise run all` and CI no longer run the same checks."
            echo "  mise run all: $local_gates"
            echo "  CI:           $ci_gates"
            echo "Update whichever is behind, and this list with it."
            exit 1
          fi
          echo "both run: $local_gates"
