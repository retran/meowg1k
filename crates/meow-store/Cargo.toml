[package]
name = "meow-store"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Internal to the workspace. Only the `meow` binary ships, so these carry no
# version contract and cargo-deny can treat their path dependencies as the
# non-hazard they are.
publish = false
description = "The SQLite database a meowg1k workspace keeps"

[dependencies]
blake3 = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
thiserror = { workspace = true }

[dev-dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
tempfile = "3"

[lints]
workspace = true
