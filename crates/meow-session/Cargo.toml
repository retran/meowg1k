[package]
name = "meow-session"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Internal to the workspace. Only the `meow` binary ships, so these carry no
# version contract and cargo-deny can treat their path dependencies as the
# non-hazard they are.
publish = false
description = "The durable record of one agent run"

[dependencies]
meow-core = { path = "../meow-core" }
meow-store = { path = "../meow-store" }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
