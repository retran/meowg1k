[package]
name = "meow-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The meow binary"
publish = false

[lib]
name = "meow_cli"
path = "src/lib.rs"

[[bin]]
name = "meow"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["std", "help", "usage", "error-context", "suggestions", "wrap_help", "string"], default-features = false }
clap_complete = "4"
meow-agent = { path = "../meow-agent" }
meow-core = { path = "../meow-core" }
meow-llm = { path = "../meow-llm" }
meow-policy = { path = "../meow-policy" }
meow-star = { path = "../meow-star" }
meow-ui = { path = "../meow-ui" }
ratatui = { version = "0.30", features = ["crossterm"] }
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
tokio-util = "0.7"

[dev-dependencies]
serde_json = { workspace = true }
tempfile = "3"

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
