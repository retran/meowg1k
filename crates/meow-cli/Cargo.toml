[package]
name = "meow-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The meow binary"
publish = false

[lib]
name = "meow_cli"
path = "src/lib.rs"

[[bin]]
name = "meow"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["std", "help", "usage", "error-context", "suggestions", "wrap_help", "string"], default-features = false }
clap_complete = "4"
flate2 = "1"
globset = "0.4"
meow-agent = { path = "../meow-agent" }
meow-core = { path = "../meow-core" }
meow-index = { path = "../meow-index" }
meow-llm = { path = "../meow-llm" }
meow-policy = { path = "../meow-policy" }
meow-session = { path = "../meow-session" }
meow-store = { path = "../meow-store" }
meow-star = { path = "../meow-star" }
meow-ui = { path = "../meow-ui" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
ratatui = { version = "0.30", features = ["crossterm"] }
regex = "1"
serde = { workspace = true }
sha2 = "0.10"
serde_json = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "sync"] }
tar = "0.4"
thiserror = { workspace = true }
tokio-util = "0.7"

[dev-dependencies]
tar = "0.4"
flate2 = "1"
serde_json = { workspace = true }
tempfile = "3"

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
