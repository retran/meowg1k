[package]
name = "meow-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "What a model provider is, and one that talks to Anthropic"
publish = false

[dependencies]
async-trait = "0.1"
meow-core = { path = "../meow-core" }
rand = "0.9"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["time", "macros", "rt"] }
tokio-util = "0.7"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }

[lints]
workspace = true
