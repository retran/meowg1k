# cargo-deny configuration. `mise run deny` and the Rust CI job both run
# `cargo deny check`, which covers advisories, licences, bans, and sources.

[advisories]
version = 2
yanked = "deny"

# Four crates in the tree are unmaintained rather than vulnerable, and all four
# arrive through `starlark`, which pins them. None has a safe upgrade, and
# there is no version of `starlark` that drops them, so the choice is between
# recording them here and not using Starlark at all.
#
# Listed one by one rather than silenced with `unmaintained = "workspace"`,
# because a new advisory against a crate this workspace depends on directly
# should still fail the check. Revisit each when `starlark` releases a version
# that moves off it.
ignore = [
    # `fxhash`, through `starlark_map`. A hash function whose author archived
    # the repository. `rustc-hash` is the successor and `starlark_map` has not
    # moved to it.
    { id = "RUSTSEC-2025-0057", reason = "starlark_map pins fxhash; no safe upgrade exists" },
    # `paste`, through `starlark`. A macro helper whose author stopped
    # maintaining it. It expands at compile time and is absent from the binary.
    { id = "RUSTSEC-2024-0436", reason = "starlark pins paste; compile-time only, and no safe upgrade exists" },
    # `derivative`, through `starlark`. A derive helper, also compile-time only.
    { id = "RUSTSEC-2024-0388", reason = "starlark pins derivative; compile-time only, and no safe upgrade exists" },
    # `atomic-polyfill`, through `starlark`'s line editor. It polyfills atomics
    # on targets that lack them, which none of the targets in
    # `.github/workflows/rust.yaml` are.
    { id = "RUSTSEC-2023-0089", reason = "reached through starlark; polyfills atomics on targets this project does not build for" },
]

[licenses]
version = 2
# meowg1k ships under Apache-2.0, so every dependency has to be compatible with
# distributing a binary under it. Copyleft licences are absent on purpose: this
# ships as a static binary, and LGPL or GPL would change what users may do with
# it.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9
# The list above covers the licences the dependencies in
# `docs/design/0.3.0-architecture.md` carry, so most entries match nothing
# while the workspace is still small. Warning about each one would train
# everybody to ignore the output of this check.
unused-allowed-license = "allow"

[bans]
# Duplicate versions are a warning, not an error. A transitive dependency
# lagging one minor version behind is normal and blocking on it costs more than
# it saves; a duplicate that matters shows up in binary size and gets its own
# issue.
multiple-versions = "warn"
# A dependency with no version constraint is a real hazard from a registry and
# not from the crate next door: a path dependency inside this workspace is
# built from the tree it is read from, so there is no version to pin.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
